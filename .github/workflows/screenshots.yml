name: Browser screenshots and E2E test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'scripts/capture_screenshots.py'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start isolated lab server
        run: |
          FLEETOPS_DB="$RUNNER_TEMP/fleetops-ci.sqlite3" python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/fleetops.log" 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8000/api/state >/dev/null && break; sleep 1; done
          curl --fail http://127.0.0.1:8000/api/state >/dev/null
      - name: Test UI flows and capture real screenshots
        run: python scripts/capture_screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleetops-browser-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
      - name: Commit verified screenshots to repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add verified browser screenshots [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
